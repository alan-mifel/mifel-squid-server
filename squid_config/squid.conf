# ─── Puerto ───────────────────────────────────────────────────────────────────
http_port 3130

# ─── Acceso ───────────────────────────────────────────────────────────────────
http_access allow all

# ─── Anonimato: suprimir headers que revelan uso de proxy ────────────────────

# No añadir X-Forwarded-For con la IP real del cliente
forwarded_for off

# No añadir el header Via (identifica explícitamente la presencia de un proxy)
via off

# Eliminar de las SOLICITUDES salientes cualquier header que delate el proxy
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
request_header_access X-Forwarded-Host deny all
request_header_access X-Forwarded-Proto deny all
request_header_access Forwarded deny all

# Eliminar de las RESPUESTAS headers de caché y proxy añadidos por Squid
reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all
reply_header_access X-Squid-Error deny all
reply_header_access X-Forwarded-For deny all
reply_header_access Forwarded deny all

# ─── Ocultar identidad en páginas de error ────────────────────────────────────
# No incluir la versión de Squid en respuestas de error HTTP
httpd_suppress_version_string on

# Hostname genérico para no filtrar el nombre real del servidor proxy
visible_hostname localhost

# ─── Conexiones ───────────────────────────────────────────────────────────────
# Mantener keep-alive hacia cliente y servidor (comportamiento más natural)
client_persistent_connections on
server_persistent_connections on
