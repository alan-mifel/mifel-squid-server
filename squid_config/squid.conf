# ─── Puerto ───────────────────────────────────────────────────────────────────
http_port 3130

# ─── ACLs básicas ─────────────────────────────────────────────────────────────
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 21
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 1025-65535
acl Safe_ports port 280
acl Safe_ports port 488
acl Safe_ports port 591
acl Safe_ports port 777
acl CONNECT method CONNECT

# ─── Acceso ───────────────────────────────────────────────────────────────────
# Bloquear puertos no seguros (protección básica)
http_access deny !Safe_ports

# Permitir CONNECT únicamente a puertos SSL (443)
http_access deny CONNECT !SSL_ports

# Permitir todo lo demás
http_access allow all

# ─── Anonimato: suprimir headers que revelan uso de proxy ────────────────────

# Eliminar X-Forwarded-For tanto si lo añadiría Squid como si ya lo trae el cliente
forwarded_for delete

# No añadir el header Via (identifica explícitamente la presencia de un proxy)
via off

# Eliminar de las SOLICITUDES salientes cualquier header que delate el proxy
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
request_header_access X-Forwarded-Host deny all
request_header_access X-Forwarded-Proto deny all
request_header_access X-Real-IP deny all
request_header_access Forwarded deny all
request_header_access Proxy-Connection deny all
request_header_access Proxy-Authorization deny all

# Eliminar de las RESPUESTAS headers de caché y proxy añadidos por Squid
reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all
reply_header_access X-Squid-Error deny all
reply_header_access X-Forwarded-For deny all
reply_header_access X-Real-IP deny all
reply_header_access Forwarded deny all

# ─── Ocultar identidad en páginas de error ────────────────────────────────────
# No incluir la versión de Squid en respuestas de error HTTP
httpd_suppress_version_string on

# Hostname genérico para no filtrar el nombre real del servidor proxy
visible_hostname localhost

# ─── DNS ──────────────────────────────────────────────────────────────────────
# Usar los mismos servidores DNS que el host para resolver al mismo edge de Akamai
dns_nameservers 8.8.8.8 8.8.4.4

# ─── IP de salida ─────────────────────────────────────────────────────────────
# Forzar que las conexiones salientes usen la IP del host (no la IP del bridge Docker).
# Cambiar por la IP real de la interfaz de red del servidor donde corre Squid.
# tcp_outgoing_address 192.168.3.111

# ─── Conexiones ───────────────────────────────────────────────────────────────
# Mantener keep-alive hacia cliente y servidor (comportamiento más natural)
client_persistent_connections on
server_persistent_connections on

# ─── Timeouts ─────────────────────────────────────────────────────────────────
connect_timeout 30 seconds
peer_connect_timeout 10 seconds
